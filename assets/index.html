<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A | B</title>
<script defer src="img-comparison-slider.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; overflow: hidden;
               font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; }
  img-comparison-slider { display: block; width: 100%; height: 100%; outline: none;
    --divider-width: 2px; --divider-color: rgba(255,255,255,.9); --divider-shadow: 0 0 6px rgba(0,0,0,.7);
    --default-handle-width: 46px; --default-handle-color: #fff; --default-handle-opacity: 1;
    --default-handle-shadow: 0 0 6px rgba(0,0,0,.8); }
  img-comparison-slider:focus { outline: none; }               /* (Safari is smoother without the focus ring) */
  img-comparison-slider video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
  /* the handle: a strip along the whole divider (the library drags only by its handle's box) with a round knob in the
     middle; the library itself sets no cursor */
  .grip { pointer-events: auto; cursor: ew-resize; width: 44px; height: 100px; display: flex; align-items: center;
          justify-content: center; touch-action: none; }
  .grip .knob { width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(255,255,255,.95);
                background: rgba(0,0,0,.4); box-shadow: 0 0 6px rgba(0,0,0,.7); display: flex; align-items: center;
                justify-content: center; color: #fff; font-size: 18px; letter-spacing: 2px; user-select: none; }
  .label { position: absolute; top: 10px; z-index: 2; pointer-events: none; padding: 3px 9px; border-radius: 4px;
           background: rgba(0,0,0,.6); font-weight: 600; max-width: 44%; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  #la { left: 10px; } #lb { right: 10px; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 58px; display: flex; align-items: center; gap: 8px;
         padding: 0 14px; background: rgba(17,17,17,.88); border-top: 1px solid #222; user-select: none; z-index: 4;
         transition: opacity .35s; }
  /* without mouse activity the bar and the pointer fade out (the keys keep working without bringing them back) */
  body.idle #bar { opacity: 0; pointer-events: none; }
  body.idle, body.idle * { cursor: none !important; }
  #bar button { background: #222; color: #ddd; border: 1px solid #383838; border-radius: 5px; padding: 6px 10px;
                font: inherit; cursor: pointer; min-width: 34px; }
  #bar button:hover { background: #2c2c2c; }
  #scrub { flex: 1; min-width: 120px; accent-color: #ddd; }
  #time { font-variant-numeric: tabular-nums; white-space: nowrap; }
  #drift { font-variant-numeric: tabular-nums; color: #888; min-width: 64px; white-space: nowrap; }
  #help { color: #777; white-space: nowrap; }
  #msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 5; max-width: 760px;
         padding: 16px 20px; background: rgba(40,0,0,.92); border: 1px solid #a33; border-radius: 8px; display: none;
         white-space: pre-wrap; line-height: 1.45; }
  #msg code { background: #000; padding: 2px 5px; border-radius: 3px; user-select: all; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <div class="label" id="la"></div>
    <div class="label" id="lb"></div>
    <img-comparison-slider id="cmp" value="50" handle="true" keyboard="disabled">
      <video slot="first" id="a" preload="auto" playsinline></video>
      <video slot="second" id="b" preload="auto" playsinline muted></video>
      <div slot="handle" class="grip" id="grip"><div class="knob">&#8249;&#8250;</div></div>
    </img-comparison-slider>
  </div>
</div>
<div id="bar">
  <button id="play" title="Play / pause (Space, or click the picture)">&#9654;</button>
  <button id="back" title="One frame back (,)">&#8249;</button>
  <button id="fwd" title="One frame forward (.)">&#8250;</button>
  <input id="scrub" type="range" min="0" max="0" step="1" value="0" title="Scrub (Left/Right: 1 s, Shift: 10 s)">
  <span id="time">00:00:00:00</span>
  <span id="drift" title="How far B's displayed frame is from A's while playing (paused frames are always the same)"></span>
  <button id="mute" title="Mute (m); the sound is A's">&#128266;</button>
  <button id="swap" title="Swap sides (s)">&#8644;</button>
  <button id="mid" title="Divider back to 50% (0)">50%</button>
  <button id="full" title="Fullscreen (f)">&#9974;</button>
  <span id="help">Space play &middot; , . frame &middot; [ ] divider &middot; s swap &middot; move the mouse for this bar</span>
</div>
<div id="msg"></div>
<script>
const VC = /*VC_CONFIG*/{"a": {"src": "a.mp4", "name": "A"}, "b": {"src": "b.mp4", "name": "B"}, "fps": 24, "start": 0, "proxy": ""}/*END*/;
const $ = (id) => document.getElementById(id);
const a = $("a"), b = $("b"), cmp = $("cmp"), scrub = $("scrub");
const fps = VC.fps || 24;
let dur = 0, frames = 0, playing = false, busy = false, pendingSeek = null, swapped = false;
let lastA = null, lastB = null, drift = 0, driftHot = 0, lead = 0, resyncAt = 0;
// WebKit (Safari) stalls when a video's playbackRate changes while playing: there B is only re-seeked, with a learned lead
const webkit = /AppleWebKit/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Electron|Firefox/.test(navigator.userAgent);

a.src = VC.a.src; b.src = VC.b.src;
const tagA = VC.blind ? "" : "A  ", tagB = VC.blind ? "" : "B  ";   // (blind: the labels alone, e.g. "picture 1")
$("la").textContent = tagA + VC.a.name; $("lb").textContent = tagB + VC.b.name;
$("la").title = VC.a.info || ""; $("lb").title = VC.b.info || "";
document.title = VC.a.name + "  |  " + VC.b.name;

function showMsg(text) { const m = $("msg"); m.innerHTML = text; m.style.display = "block"; }
function once(el, ev, ms) {
  return new Promise((res) => { const t = setTimeout(res, ms || 4000); el.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true }); });
}
const frameOf = (t) => Math.floor(t * fps + 1e-4);
function tc(n) {
  const f = n % fps, s = Math.floor(n / fps), p = (x) => String(x).padStart(2, "0");
  return p(Math.floor(s / 3600)) + ":" + p(Math.floor(s / 60) % 60) + ":" + p(s % 60) + ":" + p(f);
}
function ui() {
  const n = frameOf(a.currentTime);
  if (!scrubbing) scrub.value = n;
  $("time").textContent = tc(n) + "   frame " + n + " / " + Math.max(frames - 1, 0);
  $("play").innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
  $("mute").innerHTML = a.muted ? "&#128263;" : "&#128266;";
}

// --- layout: the picture as large as fits, at the videos' aspect
function layout() {
  const st = $("stage").getBoundingClientRect();
  const ar = (a.videoWidth && a.videoHeight) ? a.videoWidth / a.videoHeight : (VC.aspect || 16 / 9);
  let w = st.width, h = w / ar;
  if (h > st.height) { h = st.height; w = h * ar; }
  $("frame").style.width = Math.floor(w) + "px"; $("frame").style.height = Math.floor(h) + "px";
  $("grip").style.height = Math.floor(h) + "px";             // the grip runs the whole height of the divider
  // both videos get the frame's height: the library lays out its second side in the flow without a height, so a video of
  // another aspect (e.g. 2.39:1 against 4:3) would keep its own height and sit at the top instead of letterboxed in the middle
  a.style.height = b.style.height = Math.floor(h) + "px";
}
window.addEventListener("resize", layout);

// --- loading
let metaCount = 0;
function onMeta(v, name) {
  if (v.videoWidth === 0) {
    showMsg("This browser can't show the picture of <b>" + name + "</b> (it plays as audio only: its codec isn't supported here, " +
            "e.g. ProRes outside Safari).\n\nOpen it in Safari, or compare a proxy:\n<code>" + (VC.proxy || "ffmpeg -i IN -c:v libx264 -crf 14 -pix_fmt yuv420p -g 24 -c:a aac -b:a 320k -movflags +faststart OUT.mp4") + "</code>");
  }
  if (++metaCount < 2) return;
  dur = Math.min(a.duration || 0, b.duration || 0);
  frames = Math.max(1, Math.floor(dur * fps + 1e-4));
  scrub.max = frames - 1;
  layout();
  seekBoth(VC.start ? VC.start : 0.5 / fps);
}
a.addEventListener("loadedmetadata", () => onMeta(a, VC.a.name));
b.addEventListener("loadedmetadata", () => onMeta(b, VC.b.name));
for (const [v, nm] of [[a, VC.a.name], [b, VC.b.name]]) {
  v.addEventListener("error", () => showMsg("Can't load <b>" + nm + "</b> (" + (v.error ? "media error " + v.error.code : "error") + ").\n" +
    "If the codec is unsupported here, open it in Safari or compare a proxy:\n<code>" + (VC.proxy || "") + "</code>"));
}

// --- seeking: both, and wait for both (a paused frame is then exactly the same frame on both sides)
async function seekBoth(t) {
  if (!frames) return;
  t = Math.max(0, Math.min(t, (frames - 0.5) / fps));
  if (busy) { pendingSeek = t; return; }
  busy = true;
  const done = Promise.all([once(a, "seeked"), once(b, "seeked")]);
  a.currentTime = t; b.currentTime = t;
  await done;
  busy = false;
  ui();
  if (pendingSeek !== null) { const p = pendingSeek; pendingSeek = null; seekBoth(p); }
}
const seekFrame = (n) => seekBoth((Math.max(0, Math.min(n, frames - 1)) + 0.5) / fps);   // the middle of frame n

// --- play / pause: both at once (A leads, B is muted)
function play() {
  if (!frames) return;
  if (frameOf(a.currentTime) >= frames - 1) { seekFrame(0).then(play); return; }
  playing = true; driftHot = 0; drift = 0; resyncAt = 0; b.playbackRate = 1;
  a.play(); b.play();                        // (in the same task: both start together)
  ui(); tick();
}
function pause() {
  playing = false;
  a.pause(); b.pause(); b.playbackRate = 1;
  seekFrame(frameOf(a.currentTime));         // both on exactly A's frame
  ui();
}
const toggle = () => (playing ? pause() : play());
const step = (k) => { if (playing) { playing = false; a.pause(); b.pause(); } seekFrame(frameOf(a.currentTime) + k); };
a.addEventListener("ended", () => { if (playing) pause(); });
b.addEventListener("ended", () => { if (playing) pause(); });
// a stall on one side holds the other until both can play again
for (const [v, o] of [[a, b], [b, a]]) {
  v.addEventListener("waiting", async () => {
    if (!playing) return;
    o.pause();
    while (playing && (a.readyState < 3 || b.readyState < 3)) await new Promise((r) => setTimeout(r, 50));
    if (playing) { b.currentTime = a.currentTime; a.play(); b.play(); }
  });
}

// --- the drift between the frames shown while playing (B - A, in frames), kept small:
//     Chrome/Firefox: B's speed nudged by up to 5% toward A (a seek only when 12+ frames off);
//     Safari: B re-seeked to A when 4+ frames off for half a second, ahead by a lead learned from the last re-seek
function watchFrames(v, set) {
  if (!v.requestVideoFrameCallback) return;
  const cb = (now, md) => { set(md.mediaTime); v.requestVideoFrameCallback(cb); };
  v.requestVideoFrameCallback(cb);
}
watchFrames(a, (t) => (lastA = t)); watchFrames(b, (t) => (lastB = t));
function resync() { b.currentTime = Math.max(0, a.currentTime + lead); resyncAt = performance.now(); driftHot = 0; }
function tick() {
  if (!playing) { $("drift").textContent = ""; return; }
  const ta = lastA ?? a.currentTime, tb = lastB ?? b.currentTime;
  drift = 0.85 * drift + 0.15 * (tb - ta) * fps;                       // smoothed: the two frame clocks tick apart
  const d = Math.round(drift);
  $("drift").textContent = "B " + (d > 0 ? "+" : "") + d + "f";
  if (!b.seeking && !a.seeking) {
    if (!webkit) {
      if (Math.abs(drift) >= 12) { b.playbackRate = 1; resync(); drift = 0; }
      else {
        const r = Math.abs(drift) < 0.5 ? 1 : 1 - Math.max(-0.05, Math.min(0.05, drift / fps * 0.5));
        if (Math.abs(b.playbackRate - r) > 0.003) b.playbackRate = r;
      }
    } else if (resyncAt && performance.now() - resyncAt > 800) {
      lead = Math.max(-0.5, Math.min(0.5, lead - 0.8 * drift / fps));   // learn how far the last re-seek missed
      resyncAt = 0;
    } else if (!resyncAt) {
      driftHot = Math.abs(drift) > 3.5 ? driftHot + 1 : 0;
      if (driftHot > 30) { resync(); drift = 0; }
    }
  }
  ui();
  requestAnimationFrame(tick);
}

// --- controls
let scrubbing = false;
scrub.addEventListener("input", () => { scrubbing = true; if (playing) { playing = false; a.pause(); b.pause(); } seekFrame(+scrub.value); });
scrub.addEventListener("change", () => { scrubbing = false; seekFrame(+scrub.value); wake(); });
$("play").onclick = toggle;
$("back").onclick = () => step(-1);
$("fwd").onclick = () => step(1);
$("mute").onclick = () => { a.muted = !a.muted; ui(); };
$("mid").onclick = () => (cmp.value = 50);
$("swap").onclick = swap;
$("full").onclick = fullscreen;
function swap() {
  swapped = !swapped;
  a.slot = swapped ? "second" : "first"; b.slot = swapped ? "first" : "second";
  $("la").textContent = swapped ? tagB + VC.b.name : tagA + VC.a.name;
  $("lb").textContent = swapped ? tagA + VC.a.name : tagB + VC.b.name;
}
function fullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
document.addEventListener("fullscreenchange", layout); document.addEventListener("webkitfullscreenchange", layout);
// a click on the picture plays or pauses; dragging the handle doesn't
let down = null, slid = false;
cmp.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; slid = false; });
cmp.addEventListener("slide", () => (slid = true));
cmp.addEventListener("click", (e) => {
  const moved = down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 3;
  if (!slid && !moved) toggle();
});
window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, big = e.shiftKey;
  const act = {
    " ": toggle, ",": () => step(-1), ".": () => step(1), "<": () => step(-1), ">": () => step(1),
    ArrowLeft: () => seekFrame(frameOf(a.currentTime) - (big ? 10 : 1) * Math.round(fps)),
    ArrowRight: () => seekFrame(frameOf(a.currentTime) + (big ? 10 : 1) * Math.round(fps)),
    Home: () => seekFrame(0), End: () => seekFrame(frames - 1),
    "[": () => (cmp.value = Math.max(0, cmp.value - 1)), "]": () => (cmp.value = Math.min(100, +cmp.value + 1)),
    "{": () => (cmp.value = Math.max(0, cmp.value - 10)), "}": () => (cmp.value = Math.min(100, +cmp.value + 10)),
    "0": () => (cmp.value = 50), s: swap, m: () => { a.muted = !a.muted; ui(); }, f: fullscreen,
  }[k];
  if (act) { e.preventDefault(); if (playing && (k === "ArrowLeft" || k === "ArrowRight" || k === "Home" || k === "End")) { playing = false; a.pause(); b.pause(); } act(); }
});
// --- the bar hides after 2.5 s without mouse activity (not while the pointer is on it or the scrub bar is dragged);
//     moving, clicking or scrolling the mouse brings it back, the keyboard doesn't
let idleTimer = null, overBar = false;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!overBar && !scrubbing) document.body.classList.add("idle"); }, 2500);
}
for (const ev of ["mousemove", "mousedown", "wheel", "touchstart"]) window.addEventListener(ev, wake, { passive: true });
$("bar").addEventListener("mouseenter", () => (overBar = true));
$("bar").addEventListener("mouseleave", () => { overBar = false; wake(); });
wake();

// --- self-test: open the page with #selftest (used by vcompare.py --selftest): window.R, then the title "DONE"
async function selftest() {
  while (!frames) await new Promise((r) => setTimeout(r, 100));
  const R = { ua: navigator.userAgent, webkit, frames };
  await seekFrame(Math.min(550, frames - 300));
  R.seek = [frameOf(a.currentTime), frameOf(b.currentTime)];
  play(); const samples = [];
  for (let i = 0; i < 40; i++) { await new Promise((r) => setTimeout(r, 250)); samples.push(Math.round(drift)); }
  R.drift = samples; R.lead = lead; R.rateB = b.playbackRate;
  R.dropped = [a.getVideoPlaybackQuality?.().droppedVideoFrames, b.getVideoPlaybackQuality?.().droppedVideoFrames];
  pause(); await new Promise((r) => setTimeout(r, 1500));
  R.paused = [frameOf(a.currentTime), frameOf(b.currentTime)];
  step(1); await new Promise((r) => setTimeout(r, 1500));
  R.stepped = [frameOf(a.currentTime), frameOf(b.currentTime)];
  window.R = R; document.title = "DONE";
  const abs = samples.slice(8).map(Math.abs).sort((x, y) => x - y);         // (after the first two seconds)
  showMsg("Self-test (" + (webkit ? "Safari/WebKit" : "Chrome/Firefox") + "): while playing, B was within " + abs[Math.floor(abs.length / 2)] +
          " frame(s) of A (median), at most " + abs[abs.length - 1] + "; dropped frames A " + R.dropped[0] + ", B " + R.dropped[1] +
          ".\nPaused: frames " + R.paused.join(" / ") + (R.paused[0] === R.paused[1] ? " (the same)" : " (DIFFERENT)") +
          "; one frame forward: " + R.stepped.join(" / ") + ".");
}
if (location.hash === "#selftest") selftest();
layout();
</script>
</body>
</html>
